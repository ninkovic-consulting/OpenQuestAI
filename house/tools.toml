# The tool catalog. A room lists tools by id (`tools = ["git", "npm"]`), and a
# room with no list uses its agent's.
#
# Built-in tools ship with the assistant: the host's own, and those marked
# `resident = true`, which only residents use at work. Project tools name a
# program; a resident runs them in one of its room's project folders, after a yes.
#
# For a project tool:
#   program  the command it needs on this Mac
#   markers  names that mark a project as needing it, matched against the
#            files and folders in the project's top two levels; a pattern with
#            a slash is matched against the path inside the project
#   remote_hosts  hosts that mark it too, read from the remote URLs in the
#            project's .git/config

[tools.remember]
title = "Remember"
description = "Writes a note to the assistant's memory."
built_in = true

[tools.recall]
title = "Recall"
description = "Searches the assistant's notes and past conversations."
built_in = true

[tools.open_app]
title = "Open app"
description = "Opens a Mac app."
built_in = true

[tools.open_url]
title = "Open link"
description = "Opens a link in the default browser."
built_in = true

[tools.shell]
title = "Shell"
description = "Runs a shell command on this Mac, after asking you unless you make it free."
built_in = true

[tools.create_automation]
title = "Schedule an automation"
description = "Sets up an instruction to carry out at set times."
built_in = true

[tools.list_automations]
title = "List automations"
description = "Reads the automations, their next runs and last results."
built_in = true

[tools.update_automation]
title = "Change an automation"
description = "Changes an automation's name, schedule, instruction or voice."
built_in = true

[tools.pause_automation]
title = "Pause an automation"
description = "Stops an automation from running until it is resumed."
built_in = true

[tools.resume_automation]
title = "Resume an automation"
description = "Lets a paused automation run on its schedule again."
built_in = true

[tools.run_automation]
title = "Run an automation now"
description = "Runs an automation once, now, outside its schedule."
built_in = true

[tools.delete_automation]
title = "Delete an automation"
description = "Removes an automation and its results."
built_in = true

[tools.house_overview]
title = "Describe the house"
description = "Reads the rooms, who runs each, and the agents with their roles and models."
built_in = true

[tools.room_details]
title = "Describe a room"
description = "Reads one room: its agent, model, project, tools and, for the Library, its notes."
built_in = true

[tools.assistant_status]
title = "Check its own status"
description = "Reads the assistant's own setup: model, spend, voice, automations, phone, data."
built_in = true

[tools.hand_off]
title = "Hand off work"
description = "Gives a job to a resident, who works on it in their own room."
built_in = true

[tools.list_jobs]
title = "List jobs"
description = "Reads the job board: who works on what, and how it ended."
built_in = true

[tools.job_details]
title = "Look at a job"
description = "Reads one job's brief, steps, result and cost."
built_in = true

[tools.cancel_job]
title = "Cancel a job"
description = "Stops a job and any request it made to another resident."
built_in = true

[tools.start_project]
title = "Start a new project"
description = "Makes a project folder with a README and git, adds a room for it run by a resident, and can hand them a first job. Always asks first."
built_in = true

[tools.update_profile]
title = "Update what it knows about you"
description = "Changes what to call you, your business, or what to always keep in mind."
built_in = true

[tools.list_documents]
title = "List documents"
description = "Reads the list of documents in your library."
built_in = true

[tools.read_document]
title = "Read a document"
description = "Reads a document from your library, a part at a time."
built_in = true

[tools.search_documents]
title = "Search documents"
description = "Searches the text of the documents in your library."
built_in = true

[tools.add_document]
title = "Save a document"
description = "Saves what you dictate or paste as a new document in your library."
built_in = true

[tools.update_document]
title = "Change a document"
description = "Renames a document, or changes the text of one that was written rather than added from a file."
built_in = true

[tools.remove_document]
title = "Remove a document"
description = "Removes a document from your library, with the file it came from."
built_in = true

[tools.send_to_phone]
title = "Send a message to your phone"
description = "Messages your paired phone on Discord, when you ask or an automation should ping you."
built_in = true

[tools.save_procedure]
title = "Save a procedure"
description = "An agent writes down how it did a kind of work, to follow and improve next time."
built_in = true

[tools.list_procedures]
title = "List procedures"
description = "An agent lists its own procedures and the shared ones."
built_in = true

[tools.read_procedure]
title = "Read a procedure"
description = "An agent opens one of its procedures before doing that kind of work."
built_in = true

[tools.remove_procedure]
title = "Remove a procedure"
description = "An agent removes one of its own procedures (a shared one only if it wrote it)."
built_in = true

[tools.propose_tool]
title = "Propose a new tool"
description = "An agent proposes a small script as a new tool; it does nothing until you approve it at the Mac."
built_in = true

[tools.propose_change]
title = "Propose a change to itself"
description = "An agent proposes a new persona, model or thinking level for itself; you approve it at the Mac."
built_in = true

[tools.my_proposals]
title = "Its proposals"
description = "An agent reads what became of its own proposals."
built_in = true

[tools.note_progress]
title = "Note progress"
description = "A resident shows a short progress line on its job."
built_in = true
resident = true

[tools.ask_resident]
title = "Ask another resident"
description = "A resident asks another for help, through the job board."
built_in = true
resident = true

[tools.machine_status]
title = "Check the Mac"
description = "The steward reads disk, memory, battery, uptime and load."
built_in = true
resident = true

[tools.web_search]
title = "Search the web"
description = "The scout searches the web through Anthropic's search tool."
built_in = true
resident = true

[tools.web_fetch]
title = "Load a web page"
description = "The scout loads a page it was given, or found, through Anthropic's fetch tool."
built_in = true
resident = true

[tools.list_files]
title = "List files"
description = "Lists files in the room's project folders."
built_in = true
resident = true

[tools.read_file]
title = "Read a file"
description = "Reads a file in one of the room's project folders."
built_in = true
resident = true

[tools.search_files]
title = "Search files"
description = "Searches the files in the room's project folders."
built_in = true
resident = true

[tools.write_file]
title = "Write a file"
description = "Writes a file in one of the room's project folders."
built_in = true
resident = true

[tools.edit_file]
title = "Edit a file"
description = "Changes part of a file in one of the room's project folders."
built_in = true
resident = true

[tools.run_program]
title = "Run a program"
description = "Runs one of the room's programs in one of its project folders, after asking you unless you make it free."
built_in = true
resident = true

[tools.git]
title = "Git"
description = "Reads history, branches and changes in the project's repository."
program = "git"
markers = [".git"]

[tools.gh]
title = "GitHub"
description = "Works with issues, pull requests and checks on GitHub."
program = "gh"
remote_hosts = ["github.com"]

[tools.npm]
title = "npm"
description = "Installs packages and runs scripts for a Node.js project."
program = "npm"
markers = ["package.json"]

[tools.maven]
title = "Maven"
description = "Builds and tests a Java project with Maven."
program = "mvn"
markers = ["pom.xml"]

[tools.gradle]
title = "Gradle"
description = "Builds and tests a project with Gradle."
program = "gradle"
markers = ["build.gradle", "build.gradle.kts"]

[tools.python]
title = "Python"
description = "Runs and tests a Python project."
program = "python3"
markers = ["pyproject.toml", "requirements.txt"]

[tools.docker]
title = "Docker"
description = "Builds images and runs containers for the project."
program = "docker"
markers = [
    "Dockerfile",
    "compose.yaml",
    "compose.yml",
    "docker-compose.yaml",
    "docker-compose.yml",
]

[tools.xcode]
title = "Xcode"
description = "Builds and tests an Apple platform project."
program = "xcodebuild"
markers = ["*.xcodeproj", "*.xcworkspace"]

[tools.unity]
title = "Unity"
description = "Opens and builds a Unity project through Unity Hub."
program = "Unity Hub"
markers = ["ProjectSettings/ProjectVersion.txt"]

[tools.godot]
title = "Godot"
description = "Opens, runs and exports a Godot project."
program = "godot"
markers = ["project.godot"]
