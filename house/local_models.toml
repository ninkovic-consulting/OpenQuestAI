# Local models worth offering, from small to very large. Settings shows them,
# marks each against this Mac's memory and recommends one; any other Hugging
# Face repo in MLX format can still be typed in.
#
# Numbers taken on 2026-11-13 from the Hugging Face API:
#   size_bytes  the files the daemon fetches (safetensors, JSON configs, the
#               tokenizer and chat template), from /api/models/<id>?blobs=true
#   params_b    total parameters in billions, from the original model's page
#               (a mixture of experts says how many are active in `good_at`)
#   context     max_position_embeddings in the repo's config.json
#   license     the original model's licence
#   tools       whether the chat template has a tool-call format that the
#               installed mlx-lm (0.32.2) can parse; the daemon checks this
#               again from the tokenizer when the model loads, so this column
#               is only what the window shows before a download
#   tools_recommended  calls tools reliably enough to work offline
#   images      the repo's config.json has a vision_config (a vision encoder
#               ships with the weights), checked 2026-11-13. Vision sends
#               none of them images: the installed mlx-lm loads only the
#               text model, and reading images would need mlx-vlm, which is
#               not installed. A message with images on a local model gets
#               a plain line saying the model cannot see them.
#
# memory_gb is the Mac memory that runs the model comfortably: the smallest
# usual Mac size whose 65 percent holds the weights plus 2 GB for the context
# and the runtime, leaving the rest to macOS and other apps. A Mac with less
# can still run it tightly while the weights plus 1 GB fit in the 75 percent
# of memory macOS lets the GPU use.
taken = 2026-11-13

