# The default house. Vision copies this file to $VISION_HOME/house.toml on
# first run; edit that copy, not this one.
#
# The grid is made of square cells. `at` is the cell of a room's north-west
# corner as [column, row], with columns growing east and rows growing south.
# `size` is [cells wide, cells deep] and defaults to [1, 1].
#
# The default rooms can be renamed, given another agent, model, project or
# textures, but not moved or removed. Add up to 20 more rooms of 1 to 4
# cells; each must share a wall with a room already in the house. Leave out
# `at` and a new room goes into the free spot nearest the Hall.
#
# Textures name files in assets/textures/: wallpaper, teal-panel, wood-floor,
# red-carpet, pale-stone, roof-shingle, stone-tile.

# The host's name follows `[assistant] name` in config.toml unless set here,
# and its models follow `[brain] talk_model` and `heavy_model`.
[agents.host]
persona = "agents/host.md"

[agents.steward]
name = "Brass"
persona = "agents/steward.md"
model = "claude-haiku-5-5"

[agents.envoy]
name = "Wren"
persona = "agents/envoy.md"
model = "claude-haiku-5-5"

[agents.maker]
name = "Tink"
persona = "agents/maker.md"
model = "claude-opus-5-5"

[agents.checker]
name = "Tock"
persona = "agents/checker.md"
model = "claude-haiku-5-5"
heavy_model = "claude-opus-5-5"

[agents.scout]
name = "Rook"
persona = "agents/scout.md"
model = "claude-haiku-5-5"
heavy_model = "claude-opus-5-5"

[[rooms]]
id = "hall"
name = "Hall"
at = [1, 1]
size = [2, 2]
agent = "host"
floor = "red-carpet"
wall = "teal-panel"

[[rooms]]
id = "library"
name = "Library"
at = [0, 0]
agent = "host"
floor = "wood-floor"
wall = "wallpaper"

[[rooms]]
id = "control-room"
name = "Control Room"
at = [1, 0]
size = [2, 1]
agent = "steward"
floor = "stone-tile"
wall = "teal-panel"

[[rooms]]
id = "comms-room"
name = "Comms Room"
at = [3, 0]
agent = "envoy"
floor = "pale-stone"
wall = "wallpaper"

[[rooms]]
id = "kitchen"
name = "Kitchen"
at = [0, 1]
size = [1, 2]
agent = "maker"
floor = "stone-tile"
wall = "pale-stone"

[[rooms]]
id = "game-room"
name = "Game Room"
at = [3, 1]
size = [1, 2]
agent = "maker"
floor = "red-carpet"
wall = "wallpaper"

[[rooms]]
id = "garage"
name = "Garage"
at = [0, 3]
agent = "maker"
floor = "pale-stone"
wall = "stone-tile"

[[rooms]]
id = "workshop"
name = "Workshop"
at = [1, 3]
size = [2, 1]
agent = "maker"
floor = "wood-floor"
wall = "pale-stone"

[[rooms]]
id = "spare-room"
name = "Spare Room"
at = [3, 3]
agent = "checker"
floor = "wood-floor"
wall = "wallpaper"

[[rooms]]
id = "attic"
name = "Attic"
at = [4, 0]
shape = "round"
agent = "scout"
floor = "wood-floor"
wall = "roof-shingle"
