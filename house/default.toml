# The default house. Vision copies this file to $VISION_HOME/house.toml on
# first run; edit that copy, not this one.
#
# The grid is made of square cells. `at` is the cell of a room's north-west
# corner as [column, row], with columns growing east and rows growing south.
# `size` is [cells wide, cells deep] and defaults to [1, 1].
#
# The default rooms can be renamed, given another agent, model, project
# folders or textures, but not moved or removed. Add up to 20 more rooms of 1 to 4
# cells; each must share a wall with a room already in the house. Leave out
# `at` and a new room goes into the free spot nearest the Hall.
#
# Textures name files in assets/textures/: wallpaper, teal-panel, wood-floor,
# red-carpet, pale-stone, roof-shingle, stone-tile.
#
# Tools are ids from house/tools.toml. A room may list its own, as in
# tools = ["git", "gh", "npm"]; a room that lists none uses its agent's.
# A room's project tools (git, npm and the like) run in its resident's jobs,
# in one of the room's project folders, after you say yes.
#
# A room may have up to 8 project folders, in order, as in
# folders = ["~/Projects/shop", "~/Projects/shop-api"]; more can be added
# later. Each is a full path (starting with / or ~). A folder may not be the
# disk, the home folder or a folder above it, may not be listed twice, and may
# not sit inside another folder of the same room. Residents write every path
# starting with the folder's name, such as shop-api/src/app.py; two folders
# with the same name become shop and shop-2. A folder that is missing when a
# job starts is named in the job, and the others still work.

# The host's name follows `[assistant] name` in config.toml unless set here,
# and its models follow `[brain] talk_model` and `heavy_model`.
[agents.host]
persona = "agents/host.md"
tools = [
    "remember", "recall", "open_app", "open_url", "shell",
    "create_automation", "list_automations", "update_automation", "pause_automation",
    "resume_automation", "run_automation", "delete_automation",
    "house_overview", "room_details", "assistant_status",
    "hand_off", "list_jobs", "job_details", "cancel_job",
    "update_profile", "list_documents", "read_document", "search_documents",
    "add_document", "update_document", "remove_document",
]

[agents.steward]
name = "Brass"
persona = "agents/steward.md"
model = "claude-haiku-5-5"

[agents.envoy]
name = "Wren"
persona = "agents/envoy.md"
model = "claude-haiku-5-5"

[agents.maker]
name = "Tink"
persona = "agents/maker.md"
model = "claude-opus-5-5"

[agents.checker]
name = "Tock"
persona = "agents/checker.md"
model = "claude-sonnet-5-5"
heavy_model = "claude-opus-5-5"

[agents.scout]
name = "Rook"
persona = "agents/scout.md"
model = "claude-haiku-5-5"
heavy_model = "claude-opus-5-5"

[[rooms]]
id = "hall"
name = "Hall"
at = [1, 1]
size = [2, 2]
agent = "host"
floor = "red-carpet"
wall = "teal-panel"

[[rooms]]
id = "library"
name = "Library"
at = [0, 0]
agent = "steward"
floor = "wood-floor"
wall = "wallpaper"

